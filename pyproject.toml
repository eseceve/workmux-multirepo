[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workmux-multirepo"
version = "0.1.0"
description = "One implementation workspace, independent reviews across repositories"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
workmux-multirepo = "workmux_multirepo.cli:main"
wmm = "workmux_multirepo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workmux_multirepo"]
